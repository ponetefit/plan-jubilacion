<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Retiro 2036 - Gestor de CEDEARs con IA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para el gráfico de rendimiento -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight">Mi Retiro 2036</h1>
                    <p class="text-xs text-gray-400">Automatización activa al cierre de mercado</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div class="flex flex-col items-end mr-1 text-right">
                    <span id="last-update-time" class="text-[10px] text-gray-400 font-mono bg-gray-900/80 px-2.5 py-1 rounded-md border border-gray-800">Cargando...</span>
                </div>
                <button onclick="actualizarPreciosConIA()" id="btn-update-ia" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-2 px-4 rounded-lg text-xs transition-all flex items-center space-x-2">
                    <i id="ia-icon" class="fa-solid fa-wand-magic-sparkles"></i>
                    <span id="ia-text">Actualizar (IA)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        <!-- El resto de tu interfaz se mantiene igual -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 text-center shadow-xl">
            <p class="text-sm text-gray-400">Monitor automático de cierre activo. El sistema verificará cotizaciones post-17:00hs.</p>
        </div>
    </main>

    <script>
        const apiKey = "";
        
        // --- MOTOR DE AUTOMATIZACIÓN DE CIERRE ---
        function verificarCierreDiario() {
            const now = new Date();
            const hour = now.getHours();
            const today = now.toLocaleDateString();
            const lastRun = safeStorage.getItem('last_auto_update_date');

            // Si son después de las 17:00hs y no se ejecutó hoy, actualizamos
            if (hour >= 17 && lastRun !== today) {
                console.log("Detectado horario de cierre (>=17hs). Disparando actualización automática.");
                actualizarPreciosConIA(true); // true = modo silencioso
                safeStorage.setItem('last_auto_update_date', today);
            }
        }

        // Revisar cada 5 minutos
        setInterval(verificarCierreDiario, 300000);

        async function actualizarPreciosConIA(silencioso = false) {
            const btn = document.getElementById('btn-update-ia');
            if(!silencioso) mostrarToast("Buscando cotizaciones oficiales...", "info");

            // ... (Lógica de fetch a Gemini igual a tu versión anterior) ...
            
            // Simulación de actualización finalizada
            console.log("Cotizaciones actualizadas con éxito.");
        }

        // Ejecutar al cargar
        window.onload = function() {
            // ... (tu lógica original de inicialización)
            verificarCierreDiario();
        };

        // (Aquí iría el resto de tu lógica original de manejo de datos)
        const safeStorage = { getItem: (k) => localStorage.getItem(k), setItem: (k,v) => localStorage.setItem(k,v) };
    </script>
</body>
</html>
