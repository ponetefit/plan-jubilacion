name: Actualizar precios CEDEAR

on:
  schedule:
    # Lunes a viernes, hora Argentina (UTC-3):
    #   11:00 hs → cron 14:00 UTC
    #   15:00 hs → cron 18:00 UTC
    #   18:00 hs → cron 21:00 UTC
    - cron: '0 14 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:   # permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  actualizar-precios:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Obtener precios y actualizar index.html
        run: python obtener_precios_cedears.py --html index.html

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html precios_cedears.json
          git diff --staged --quiet \
            || git commit -m "Precios CEDEAR actualizados $(date +'%d/%m/%Y %H:%M') hs"
          git push
