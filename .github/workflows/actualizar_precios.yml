name: Actualizar Precios CEDEARs

on:
  schedule:
    # Lunes a viernes a las 21:00 UTC = 18:00 Argentina
    - cron: '0 21 * * 1-5'
  workflow_dispatch:  # permite ejecutarlo manualmente también

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pytz

      - name: Ejecutar script de precios
        run: python .github/scripts/actualizar_precios.py

      - name: Commitear precios_cedears.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precios_cedears.json
          git diff --staged --quiet || git commit -m "chore: actualizar precios CEDEARs $(date +'%d/%m/%Y %H:%M')"
          git push
